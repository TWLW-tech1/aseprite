name: Build Aseprite Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Skia
        shell: bash
        run: |
          this_dir=$(cygpath "${{ github.workspace }}")
          skia_url=$(source "$this_dir/laf/misc/skia-url.sh" | xargs)
          skia_file=$(basename "$skia_url")
          curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
          unzip "$skia_file" -d skia

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Generate Makefiles
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(realpath skia) \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)

      - name: Compile
        shell: bash
        run: |
          cmake --build build --parallel
          
      - name: Bundle OpenSSL DLLs
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build\bin'

          $opensslDir = @(
            'C:\Program Files\OpenSSL\bin',
            'C:\Program Files\OpenSSL-Win64\bin'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $opensslDir) {
            throw 'OpenSSL bin directory was not found'
          }

          foreach ($dll in @(
            'libcrypto-3-x64.dll',
            'libssl-3-x64.dll'
          )) {
            $src = Join-Path $opensslDir $dll

            if (-not (Test-Path $src)) {
              throw "Missing DLL: $src"
            }

            Copy-Item $src $bin -Force
          }

          Get-ChildItem $bin

      - name: Upload Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-release-lua
          path: build/bin
          if-no-files-found: error
